global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "telemetry-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["telemetry-service:8090"]

  - job_name: "logistics-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["logistics-service:8080"]