spring:
  application:
    name: logistics-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:password}
    listener:
      simple:
        concurrency: 4
        max-concurrency: 16
        prefetch: 100
  jpa:
    database: POSTGRESQL
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/logistics
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}       # service name in docker-compose
      port: ${REDIS_PORT:6379}
      timeout: 10000
      password: ${REDIS_PASSWORD:yourpassword}
  cache:
    type: redis
    redis:
      time-to-live: 300000   # 5 minutes in milliseconds
rabbitmq:
  exchange: telemetry.exchange
  queue: telemetry.queue
  routing-key: telemetry.#
  dlq: telemetry.dlq
server:
  port: ${LOGISTICS_SERVICE_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        logistics_route_deviation_meters: true
    tags:
      application: logistics-service
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Port 4318 is the default for OTLP over HTTP
          endpoint: "http://${OTEL_COLLECTOR_HOST:localhost}:4318/v1/traces"
  tracing:
    propagation:
      type: [ W3C ]
    observations:
      key-values:
        messaging:
          enabled: true
    sampling:
      # Use 1.0 to see all traces in development
      probability: 1.0

